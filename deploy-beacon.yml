# GitHub Actions Workflow for beacon.host Deployment

name: Deploy to beacon.host
on:
  push:
    branches:
      - main # Triggers the workflow whenever code is pushed to the main branch
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository files onto the GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Run the deployment script targeting your specific slug
      - name: Publish updates to pointed-edge-44.beacon.host
        env:

          BEACON_API_KEY: "chk_a22496ee8ed746ab82e517f87d3bd28fec8397fed471559fcb62eacae0553221"
        run: |
          # Determine target deployment folder.
          DEPLOY_DIR="."
          
          if [ -d "./dist" ]; then
            DEPLOY_DIR="./dist"
          elif [ -d "./build" ]; then
            DEPLOY_DIR="./build"
          fi
          
          echo "Deploying assets from: \$DEPLOY_DIR"
          
          # Fetch and run the publisher script, pointing it to your fixed slug
          curl -fsSL https://beacon.host/publish.py | python3 - "\$DEPLOY_DIR" pointed-edge-44


